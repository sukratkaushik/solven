apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: insolvenz-waechter
  labels:
    cloud.googleapis.com/location: europe-west3 # Frankfurt am Main
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0" # Scales to zero when idle (cost = €0)
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/client-name: gcloud
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: insolvenz-waechter-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: europe-west3-docker.pkg.dev/PROJECT_ID/insolvenz-waechter-repo/web:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_SITE_URL
              value: "https://insolvenz-waechter.de"
            # Database and API Secrets to be populated via Secret Manager
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-url
                  key: latest
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-secret-key
                  key: latest
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: stripe-webhook-secret
                  key: latest
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: resend-api-key
                  key: latest
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: cron-secret
                  key: latest
